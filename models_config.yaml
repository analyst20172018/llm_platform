parameter_templates:
  web_search: &param_web_search
    type: boolean
    default: false
    ui: toggle
    label: Web Search
  code_execution: &param_code_execution
    type: boolean
    default: false
    ui: toggle
    label: Code Execution
  citations_enabled: &param_citations_enabled
    type: boolean
    default: false
    ui: toggle
    label: Citations Enabled
  url_context: &param_url_context
    type: boolean
    default: false
    ui: toggle
    label: URL Context
  function_calling: &param_function_calling
    type: boolean
    default: true
    ui: hidden
    send_default: false
    include_in_request: false
  structured_output: &param_structured_output
    type: boolean
    default: true
    ui: hidden
    send_default: false
  temperature_fixed_1: &param_temperature_fixed_1
    type: float
    default: 1
    ui: hidden
  max_tokens: &param_max_tokens
    type: integer
    ui: hidden
  max_tokens_as_max_output: &param_max_output_tokens
    type: integer
    ui: hidden
    request_key: max_output_tokens
  reasoning_mode: &param_reasoning_mode # OpenAI GPT-5.6+ pro mode
    type: enum
    options: [standard, pro]
    default: standard
    ui: select
    label: Pro Mode
    send_default: false # API defaults to standard; send only when user selects a mode
    request_key: reasoning.mode
  thinking_mode: &param_thinking_mode # DeepSeek thinking mode toggle (adapter sends it via extra_body)
    type: enum
    options: [enabled, disabled]
    default: enabled
    ui: select
    label: Thinking
    request_key: thinking.type
  reasoning_effort_deepseek: &param_reasoning_effort_deepseek # DeepSeek effort, only applied in thinking mode
    type: enum
    options: [low, high, max]
    default: high
    ui: select
    label: Reasoning
  tool_choice: &param_tool_choice
    type: enum
    options: [auto, none, required]
    default: auto
    ui: select
    label: Tool Choice
    send_default: false
  agent_count: &param_agent_count # OpenAI Multi-agent (beta): max concurrent subagents, 0 = single agent
    type: enum
    options: [0, 2, 3]
    default: 0
    ui: select
    label: Parallel Agents
    send_default: false # send only when the user explicitly enables multi-agent

